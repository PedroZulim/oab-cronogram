name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 -m unittest discover -s tests
      - name: Test schedule search
        run: |
          mkdir -p build/search-tests
          javac -encoding UTF-8 -d build/search-tests app/src/main/java/br/com/pedrozulim/oab/ScheduleSearch.java tests/ScheduleSearchTest.java
          java -cp build/search-tests br.com.pedrozulim.oab.ScheduleSearchTest
      - name: Test structured study guides
        run: |
          mkdir -p build/guide-fixtures build/guide-tests
          python3 -c "import json,pathlib; days=json.loads(pathlib.Path('app/src/main/assets/schedule.json').read_text())['days']; [pathlib.Path('build/guide-fixtures',str(d['day'])+'.txt').write_text(d['details']) for d in days]"
          javac -encoding UTF-8 -d build/guide-tests app/src/main/java/br/com/pedrozulim/oab/StudyGuide.java tests/StudyGuideTest.java
          java -cp build/guide-tests br.com.pedrozulim.oab.StudyGuideTest build/guide-fixtures
      - run: sh ./gradlew assembleDebug lintDebug
      - name: Test reminder recurrence
        run: |
          mkdir -p build/reminder-tests
          javac -encoding UTF-8 -d build/reminder-tests app/src/main/java/br/com/pedrozulim/oab/ReminderTime.java tests/ReminderTimeTest.java
          java -cp build/reminder-tests br.com.pedrozulim.oab.ReminderTimeTest
      - uses: actions/upload-artifact@v4
        with:
          name: oab-120-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
